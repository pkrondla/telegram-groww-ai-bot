name: CD - Deploy to Windows EC2 (Native Python + NSSM)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
  DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
  INDEX_ORDER_LOTS_COUNT: ${{ vars.INDEX_ORDER_LOTS_COUNT || '1' }}
  STOCK_ORDER_LOTS_COUNT: ${{ vars.STOCK_ORDER_LOTS_COUNT || '1' }}
  ORDER_QUANTITY: ${{ vars.ORDER_QUANTITY || '1' }}
  TARGET_BUFFER_PCT: ${{ vars.TARGET_BUFFER_PCT || '0.005' }}
  MULTI_TARGET_ENABLED: ${{ vars.MULTI_TARGET_ENABLED || 'true' }}
  TARGET_SPLIT_2: ${{ vars.TARGET_SPLIT_2 || '10:90' }}
  TARGET_SPLIT_3: ${{ vars.TARGET_SPLIT_3 || '20:50:30' }}
  TARGET_PRICE_TICK_SIZE: ${{ vars.TARGET_PRICE_TICK_SIZE || '0.05' }}
  INDEX_POSITION_SIZING_MODE: ${{ vars.INDEX_POSITION_SIZING_MODE || 'fixed' }}
  STOCK_POSITION_SIZING_MODE: ${{ vars.STOCK_POSITION_SIZING_MODE || 'risk' }}
  RISK_PCT_PER_TRADE: ${{ vars.RISK_PCT_PER_TRADE || '0.02' }}
  MAX_TOTAL_OPEN_RISK_PCT: ${{ vars.MAX_TOTAL_OPEN_RISK_PCT || '0.2' }}
  INDEX_MIN_LOTS: ${{ vars.INDEX_MIN_LOTS || '1' }}
  INDEX_MAX_LOTS: ${{ vars.INDEX_MAX_LOTS || '15' }}
  STOCK_MIN_LOTS: ${{ vars.STOCK_MIN_LOTS || '1' }}
  STOCK_MAX_LOTS: ${{ vars.STOCK_MAX_LOTS || '10' }}
  RISK_MODE_ON_ZERO_LOTS: ${{ vars.RISK_MODE_ON_ZERO_LOTS || 'fixed' }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
  ENTRY_QUEUE_ENABLED: ${{ vars.ENTRY_QUEUE_ENABLED || 'true' }}
  ENTRY_QUEUE_POLL_SEC: ${{ vars.ENTRY_QUEUE_POLL_SEC || '30' }}
  ENTRY_QUEUE_MAX_WAIT_MIN: ${{ vars.ENTRY_QUEUE_MAX_WAIT_MIN || '30' }}
  SIZE_ADVISORY_TTL_SEC: ${{ vars.SIZE_ADVISORY_TTL_SEC || '900' }}
  ENTRY_SINGLE_LIMIT_ORDER: ${{ vars.ENTRY_SINGLE_LIMIT_ORDER || 'true' }}
  CHASE_MIN_RR: ${{ vars.CHASE_MIN_RR || '1.0' }}
  CHASE_RR_TARGET_INDEX: ${{ vars.CHASE_RR_TARGET_INDEX || '2' }}
  ACTIVE_RECONCILE_ENABLED: ${{ vars.ACTIVE_RECONCILE_ENABLED || 'true' }}
  ACTIVE_RECONCILE_POLL_SEC: ${{ vars.ACTIVE_RECONCILE_POLL_SEC || '1800' }}
  AUTO_REARM_PROTECTION: ${{ vars.AUTO_REARM_PROTECTION || 'true' }}
  AUTO_REARM_POLL_SEC: ${{ vars.AUTO_REARM_POLL_SEC || '900' }}
  OCO_PLAN_ENFORCEMENT_MODE: ${{ vars.OCO_PLAN_ENFORCEMENT_MODE || 'ENFORCE' }}
  VOL_SL_SCHEDULE_ENABLED: ${{ vars.VOL_SL_SCHEDULE_ENABLED || 'true' }}
  VOL_SL_WIDEN_TIME_IST: ${{ vars.VOL_SL_WIDEN_TIME_IST || '15:20' }}
  VOL_SL_RESTORE_TIME_IST: ${{ vars.VOL_SL_RESTORE_TIME_IST || '09:20' }}
  VOL_SL_WIDEN_PCT: ${{ vars.VOL_SL_WIDEN_PCT || '0.20' }}
  VOL_SL_SCHEDULE_POLL_SEC: ${{ vars.VOL_SL_SCHEDULE_POLL_SEC || '30' }}
  VOL_SL_SKIP_WEEKENDS: ${{ vars.VOL_SL_SKIP_WEEKENDS || 'false' }}
  EOD_SUMMARY_ENABLED: ${{ vars.EOD_SUMMARY_ENABLED || 'true' }}
  EOD_SUMMARY_POLL_SEC: ${{ vars.EOD_SUMMARY_POLL_SEC || '30' }}
  EOD_SUMMARY_SKIP_WEEKENDS: ${{ vars.EOD_SUMMARY_SKIP_WEEKENDS || 'true' }}
  MGMT_QUEUE_ENABLED: ${{ vars.MGMT_QUEUE_ENABLED || 'true' }}
  MGMT_QUEUE_POLL_SEC: ${{ vars.MGMT_QUEUE_POLL_SEC || '10' }}
  MGMT_QUEUE_MAX_RETRIES: ${{ vars.MGMT_QUEUE_MAX_RETRIES || '5' }}
  MGMT_QUEUE_TTL_MIN: ${{ vars.MGMT_QUEUE_TTL_MIN || '360' }}
  MARKET_OPEN_TIME_IST: ${{ vars.MARKET_OPEN_TIME_IST || '09:15' }}
  MARKET_CLOSE_TIME_IST: ${{ vars.MARKET_CLOSE_TIME_IST || '15:30' }}
  BROKER_WINDOW_PREOPEN_MIN: ${{ vars.BROKER_WINDOW_PREOPEN_MIN || '15' }}
  BROKER_WINDOW_POSTCLOSE_MIN: ${{ vars.BROKER_WINDOW_POSTCLOSE_MIN || '5' }}
  GROWW_AUTH_POLL_SEC: ${{ vars.GROWW_AUTH_POLL_SEC || '60' }}
  EXTEND_RANGE_ALLOWS_ENTRY: ${{ vars.EXTEND_RANGE_ALLOWS_ENTRY || 'false' }}
  SQLITE_JOURNAL_MODE: ${{ vars.SQLITE_JOURNAL_MODE || 'MEMORY' }}
  SQLITE_BUSY_TIMEOUT_MS: ${{ vars.SQLITE_BUSY_TIMEOUT_MS || '30000' }}
  SQLITE_LOCK_RETRY_SEC: ${{ vars.SQLITE_LOCK_RETRY_SEC || '600' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Required GitHub Secrets:
      # - WINRM_HOST: public IP or DNS for the Windows EC2 instance
      # - WINRM_USERNAME: Windows login user (for example, Administrator)
      # - WINRM_PASSWORD: Windows login password
      # - GH_PAT: token with read access to this repo (used for git clone/pull)
      #
      # One-time EC2 setup prerequisites:
      # - WinRM over HTTPS enabled and reachable on port 5986
      # - Python 3.12 on PATH
      # - Git on PATH
      # - nssm.exe on PATH (for example, C:\Windows\System32\nssm.exe)
      # - Port 5986 allowed in EC2 Security Group (INBOUND)
      #
      # Note: The WinRM step disables server certificate validation because self-signed
      # certs are common on EC2. For stricter security, install a trusted certificate
      # on the instance and change server_cert_validation to 'validate'.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WinRM client
        run: python -m pip install --upgrade pip pywinrm

      - name: Deploy over WinRM (HTTPS 5986)
        env:
          WINRM_HOST: ${{ secrets.WINRM_HOST }}
          WINRM_USERNAME: ${{ secrets.WINRM_USERNAME }}
          WINRM_PASSWORD: ${{ secrets.WINRM_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_TARGET_CHAT_ID: ${{ secrets.TELEGRAM_TARGET_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
          GROWW_ACCOUNTS_JSON: ${{ secrets.GROWW_ACCOUNTS_JSON }}
          DRY_RUN: ${{ env.DRY_RUN }}
          INDEX_ORDER_LOTS_COUNT: ${{ env.INDEX_ORDER_LOTS_COUNT }}
          STOCK_ORDER_LOTS_COUNT: ${{ env.STOCK_ORDER_LOTS_COUNT }}
          ORDER_QUANTITY: ${{ env.ORDER_QUANTITY }}
          TARGET_BUFFER_PCT: ${{ env.TARGET_BUFFER_PCT }}
          MULTI_TARGET_ENABLED: ${{ env.MULTI_TARGET_ENABLED }}
          TARGET_SPLIT_2: ${{ env.TARGET_SPLIT_2 }}
          TARGET_SPLIT_3: ${{ env.TARGET_SPLIT_3 }}
          TARGET_PRICE_TICK_SIZE: ${{ env.TARGET_PRICE_TICK_SIZE }}
          INDEX_POSITION_SIZING_MODE: ${{ env.INDEX_POSITION_SIZING_MODE }}
          STOCK_POSITION_SIZING_MODE: ${{ env.STOCK_POSITION_SIZING_MODE }}
          RISK_PCT_PER_TRADE: ${{ env.RISK_PCT_PER_TRADE }}
          MAX_TOTAL_OPEN_RISK_PCT: ${{ env.MAX_TOTAL_OPEN_RISK_PCT }}
          INDEX_MIN_LOTS: ${{ env.INDEX_MIN_LOTS }}
          INDEX_MAX_LOTS: ${{ env.INDEX_MAX_LOTS }}
          STOCK_MIN_LOTS: ${{ env.STOCK_MIN_LOTS }}
          STOCK_MAX_LOTS: ${{ env.STOCK_MAX_LOTS }}
          RISK_MODE_ON_ZERO_LOTS: ${{ env.RISK_MODE_ON_ZERO_LOTS }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENTRY_QUEUE_ENABLED: ${{ env.ENTRY_QUEUE_ENABLED }}
          ENTRY_QUEUE_POLL_SEC: ${{ env.ENTRY_QUEUE_POLL_SEC }}
          ENTRY_QUEUE_MAX_WAIT_MIN: ${{ env.ENTRY_QUEUE_MAX_WAIT_MIN }}
          SIZE_ADVISORY_TTL_SEC: ${{ env.SIZE_ADVISORY_TTL_SEC }}
          ENTRY_SINGLE_LIMIT_ORDER: ${{ env.ENTRY_SINGLE_LIMIT_ORDER }}
          CHASE_MIN_RR: ${{ env.CHASE_MIN_RR }}
          CHASE_RR_TARGET_INDEX: ${{ env.CHASE_RR_TARGET_INDEX }}
          ACTIVE_RECONCILE_ENABLED: ${{ env.ACTIVE_RECONCILE_ENABLED }}
          ACTIVE_RECONCILE_POLL_SEC: ${{ env.ACTIVE_RECONCILE_POLL_SEC }}
          AUTO_REARM_PROTECTION: ${{ env.AUTO_REARM_PROTECTION }}
          AUTO_REARM_POLL_SEC: ${{ env.AUTO_REARM_POLL_SEC }}
          OCO_PLAN_ENFORCEMENT_MODE: ${{ env.OCO_PLAN_ENFORCEMENT_MODE }}
          VOL_SL_SCHEDULE_ENABLED: ${{ env.VOL_SL_SCHEDULE_ENABLED }}
          VOL_SL_WIDEN_TIME_IST: ${{ env.VOL_SL_WIDEN_TIME_IST }}
          VOL_SL_RESTORE_TIME_IST: ${{ env.VOL_SL_RESTORE_TIME_IST }}
          VOL_SL_WIDEN_PCT: ${{ env.VOL_SL_WIDEN_PCT }}
          VOL_SL_SCHEDULE_POLL_SEC: ${{ env.VOL_SL_SCHEDULE_POLL_SEC }}
          VOL_SL_SKIP_WEEKENDS: ${{ env.VOL_SL_SKIP_WEEKENDS }}
          EOD_SUMMARY_ENABLED: ${{ env.EOD_SUMMARY_ENABLED }}
          EOD_SUMMARY_POLL_SEC: ${{ env.EOD_SUMMARY_POLL_SEC }}
          EOD_SUMMARY_SKIP_WEEKENDS: ${{ env.EOD_SUMMARY_SKIP_WEEKENDS }}
          MGMT_QUEUE_ENABLED: ${{ env.MGMT_QUEUE_ENABLED }}
          MGMT_QUEUE_POLL_SEC: ${{ env.MGMT_QUEUE_POLL_SEC }}
          MGMT_QUEUE_MAX_RETRIES: ${{ env.MGMT_QUEUE_MAX_RETRIES }}
          MGMT_QUEUE_TTL_MIN: ${{ env.MGMT_QUEUE_TTL_MIN }}
          MARKET_OPEN_TIME_IST: ${{ env.MARKET_OPEN_TIME_IST }}
          MARKET_CLOSE_TIME_IST: ${{ env.MARKET_CLOSE_TIME_IST }}
          BROKER_WINDOW_PREOPEN_MIN: ${{ env.BROKER_WINDOW_PREOPEN_MIN }}
          BROKER_WINDOW_POSTCLOSE_MIN: ${{ env.BROKER_WINDOW_POSTCLOSE_MIN }}
          GROWW_AUTH_POLL_SEC: ${{ env.GROWW_AUTH_POLL_SEC }}
          EXTEND_RANGE_ALLOWS_ENTRY: ${{ env.EXTEND_RANGE_ALLOWS_ENTRY }}
          SQLITE_JOURNAL_MODE: ${{ env.SQLITE_JOURNAL_MODE }}
          SQLITE_BUSY_TIMEOUT_MS: ${{ env.SQLITE_BUSY_TIMEOUT_MS }}
          SQLITE_LOCK_RETRY_SEC: ${{ env.SQLITE_LOCK_RETRY_SEC }}
        run: |
          python - <<'PY'
          import os
          import sys
          import base64
          import winrm

          host = os.environ["WINRM_HOST"]
          username = os.environ["WINRM_USERNAME"]
          password = os.environ["WINRM_PASSWORD"]
          endpoint = f"https://{host}:5986/wsman"

          session = winrm.Session(
              endpoint,
              auth=(username, password),
              transport="basic",
              server_cert_validation="ignore",
          )

          def clean(name: str) -> str:
              return str(os.environ.get(name, "")).replace("\r", "").replace("\n", "\\n")

          def run_ps(script: str, name: str) -> None:
              r = session.run_ps(script)
              out = r.std_out.decode("utf-8", errors="replace")
              err = r.std_err.decode("utf-8", errors="replace")
              if out:
                  sys.stdout.write(out)
              if err:
                  sys.stderr.write(err)
              if r.status_code != 0:
                  raise SystemExit(f"{name} failed with status_code={r.status_code}")

          env_lines = [
              f"TELEGRAM_API_ID={clean('TELEGRAM_API_ID')}",
              f"TELEGRAM_API_HASH={clean('TELEGRAM_API_HASH')}",
              f"TELEGRAM_TARGET_CHAT_ID={clean('TELEGRAM_TARGET_CHAT_ID')}",
              f"TELEGRAM_ADMIN_ID={clean('TELEGRAM_ADMIN_ID')}",
              f"TELEGRAM_BOT_TOKEN={clean('TELEGRAM_BOT_TOKEN')}",
              "TELEGRAM_SESSION_NAME=session_name",
              "SESSION_PATH=data/session_name",
              "DB_PATH=data/trading_bot.db",
              f"OPENAI_API_KEY={clean('OPENAI_API_KEY')}",
              f"OPENAI_MODEL={clean('OPENAI_MODEL')}",
              f"GROWW_ACCOUNTS_JSON={clean('GROWW_ACCOUNTS_JSON')}",
              f"DRY_RUN={clean('DRY_RUN')}",
              f"INDEX_ORDER_LOTS_COUNT={clean('INDEX_ORDER_LOTS_COUNT')}",
              f"STOCK_ORDER_LOTS_COUNT={clean('STOCK_ORDER_LOTS_COUNT')}",
              f"ORDER_QUANTITY={clean('ORDER_QUANTITY')}",
              f"TARGET_BUFFER_PCT={clean('TARGET_BUFFER_PCT')}",
              f"MULTI_TARGET_ENABLED={clean('MULTI_TARGET_ENABLED')}",
              f"TARGET_SPLIT_2={clean('TARGET_SPLIT_2')}",
              f"TARGET_SPLIT_3={clean('TARGET_SPLIT_3')}",
              f"TARGET_PRICE_TICK_SIZE={clean('TARGET_PRICE_TICK_SIZE')}",
              f"INDEX_POSITION_SIZING_MODE={clean('INDEX_POSITION_SIZING_MODE')}",
              f"STOCK_POSITION_SIZING_MODE={clean('STOCK_POSITION_SIZING_MODE')}",
              f"RISK_PCT_PER_TRADE={clean('RISK_PCT_PER_TRADE')}",
              f"MAX_TOTAL_OPEN_RISK_PCT={clean('MAX_TOTAL_OPEN_RISK_PCT')}",
              f"INDEX_MIN_LOTS={clean('INDEX_MIN_LOTS')}",
              f"INDEX_MAX_LOTS={clean('INDEX_MAX_LOTS')}",
              f"STOCK_MIN_LOTS={clean('STOCK_MIN_LOTS')}",
              f"STOCK_MAX_LOTS={clean('STOCK_MAX_LOTS')}",
              f"RISK_MODE_ON_ZERO_LOTS={clean('RISK_MODE_ON_ZERO_LOTS')}",
              f"LOG_LEVEL={clean('LOG_LEVEL')}",
              f"ENTRY_QUEUE_ENABLED={clean('ENTRY_QUEUE_ENABLED')}",
              f"ENTRY_QUEUE_POLL_SEC={clean('ENTRY_QUEUE_POLL_SEC')}",
              f"ENTRY_QUEUE_MAX_WAIT_MIN={clean('ENTRY_QUEUE_MAX_WAIT_MIN')}",
              f"SIZE_ADVISORY_TTL_SEC={clean('SIZE_ADVISORY_TTL_SEC')}",
              f"ENTRY_SINGLE_LIMIT_ORDER={clean('ENTRY_SINGLE_LIMIT_ORDER')}",
              f"CHASE_MIN_RR={clean('CHASE_MIN_RR')}",
              f"CHASE_RR_TARGET_INDEX={clean('CHASE_RR_TARGET_INDEX')}",
              f"ACTIVE_RECONCILE_ENABLED={clean('ACTIVE_RECONCILE_ENABLED')}",
              f"ACTIVE_RECONCILE_POLL_SEC={clean('ACTIVE_RECONCILE_POLL_SEC')}",
              f"AUTO_REARM_PROTECTION={clean('AUTO_REARM_PROTECTION')}",
              f"AUTO_REARM_POLL_SEC={clean('AUTO_REARM_POLL_SEC')}",
              f"OCO_PLAN_ENFORCEMENT_MODE={clean('OCO_PLAN_ENFORCEMENT_MODE')}",
              f"VOL_SL_SCHEDULE_ENABLED={clean('VOL_SL_SCHEDULE_ENABLED')}",
              f"VOL_SL_WIDEN_TIME_IST={clean('VOL_SL_WIDEN_TIME_IST')}",
              f"VOL_SL_RESTORE_TIME_IST={clean('VOL_SL_RESTORE_TIME_IST')}",
              f"VOL_SL_WIDEN_PCT={clean('VOL_SL_WIDEN_PCT')}",
              f"VOL_SL_SCHEDULE_POLL_SEC={clean('VOL_SL_SCHEDULE_POLL_SEC')}",
              f"VOL_SL_SKIP_WEEKENDS={clean('VOL_SL_SKIP_WEEKENDS')}",
              f"EOD_SUMMARY_ENABLED={clean('EOD_SUMMARY_ENABLED')}",
              f"EOD_SUMMARY_POLL_SEC={clean('EOD_SUMMARY_POLL_SEC')}",
              f"EOD_SUMMARY_SKIP_WEEKENDS={clean('EOD_SUMMARY_SKIP_WEEKENDS')}",
              f"MGMT_QUEUE_ENABLED={clean('MGMT_QUEUE_ENABLED')}",
              f"MGMT_QUEUE_POLL_SEC={clean('MGMT_QUEUE_POLL_SEC')}",
              f"MGMT_QUEUE_MAX_RETRIES={clean('MGMT_QUEUE_MAX_RETRIES')}",
              f"MGMT_QUEUE_TTL_MIN={clean('MGMT_QUEUE_TTL_MIN')}",
              f"MARKET_OPEN_TIME_IST={clean('MARKET_OPEN_TIME_IST')}",
              f"MARKET_CLOSE_TIME_IST={clean('MARKET_CLOSE_TIME_IST')}",
              f"BROKER_WINDOW_PREOPEN_MIN={clean('BROKER_WINDOW_PREOPEN_MIN')}",
              f"BROKER_WINDOW_POSTCLOSE_MIN={clean('BROKER_WINDOW_POSTCLOSE_MIN')}",
              f"GROWW_AUTH_POLL_SEC={clean('GROWW_AUTH_POLL_SEC')}",
              f"EXTEND_RANGE_ALLOWS_ENTRY={clean('EXTEND_RANGE_ALLOWS_ENTRY')}",
              f"SQLITE_JOURNAL_MODE={clean('SQLITE_JOURNAL_MODE')}",
              f"SQLITE_BUSY_TIMEOUT_MS={clean('SQLITE_BUSY_TIMEOUT_MS')}",
              f"SQLITE_LOCK_RETRY_SEC={clean('SQLITE_LOCK_RETRY_SEC')}",
          ]
          env_b64 = base64.b64encode(("\n".join(env_lines) + "\n").encode("utf-8")).decode("ascii")
          launcher_b64 = base64.b64encode(
              (
                  '$ErrorActionPreference = "Stop"\n'
                  '$repo = "C:\\groww-bot"\n'
                  'Get-Content (Join-Path $repo ".env") | ForEach-Object {\n'
                  '  if ($_ -match "^\\s*#" -or [string]::IsNullOrWhiteSpace($_)) { return }\n'
                  '  $parts = $_.Split("=", 2)\n'
                  '  if ($parts.Count -eq 2) { [System.Environment]::SetEnvironmentVariable($parts[0], $parts[1], "Process") }\n'
                  '}\n'
                  '$pythonCandidates = @(\n'
                  '  "C:\\Program Files\\Python312\\python.exe",\n'
                  '  "C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python312\\python.exe",\n'
                  '  "C:\\Python312\\python.exe"\n'
                  ')\n'
                  '$pythonExe = $pythonCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1\n'
                  'if (-not $pythonExe) {\n'
                  '  $cmd = Get-Command python -ErrorAction SilentlyContinue\n'
                  '  if ($cmd) { $pythonExe = $cmd.Source }\n'
                  '}\n'
                  'if (-not $pythonExe) { throw "Python executable not found. Install Python 3.12 system-wide or update launcher path." }\n'
                  'Set-Location $repo\n'
                  '& $pythonExe -m app.main\n'
              ).encode("utf-8")
          ).decode("ascii")

          clone_url = f"https://x-access-token:{clean('GH_PAT')}@github.com/{clean('GITHUB_REPOSITORY')}.git"

          run_ps(
              f"""
              $ErrorActionPreference = "Stop"
              function Invoke-Native([scriptblock]$Command, [string]$Name) {{
                & $Command
                if ($LASTEXITCODE -ne 0) {{
                  throw "$Name failed with exit code $LASTEXITCODE"
                }}
              }}
              $repo = "C:\\groww-bot"
              $logsDir = Join-Path $repo "logs"
              $dataDir = Join-Path $repo "data"
              $backupDataDir = "C:\\groww-bot-data-backup"
              if (-not (Get-Command nssm -ErrorAction SilentlyContinue)) {{ throw "nssm was not found on PATH." }}
              if (Test-Path (Join-Path $repo ".git")) {{
                Invoke-Native {{ git -C $repo pull origin main }} "git pull"
              }} else {{
                if (Test-Path $repo) {{
                  if (Test-Path $dataDir) {{
                    if (Test-Path $backupDataDir) {{
                      Remove-Item -Recurse -Force $backupDataDir
                    }}
                    Move-Item -Path $dataDir -Destination $backupDataDir
                  }}
                  Remove-Item -Recurse -Force $repo
                }}
                Invoke-Native {{ git clone "{clone_url}" $repo }} "git clone"
                if (Test-Path $backupDataDir) {{
                  New-Item -ItemType Directory -Path $repo -Force | Out-Null
                  Move-Item -Path $backupDataDir -Destination $dataDir
                }}
              }}
              New-Item -ItemType Directory -Path $logsDir -Force | Out-Null
              New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
              Invoke-Native {{ python -m pip install --upgrade pip }} "pip upgrade"
              Invoke-Native {{ python -m pip install -r (Join-Path $repo "requirements.txt") }} "pip install requirements"
              """,
              "prep/clone/install",
          )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $repo = "C:\\groww-bot"
              $envPath = Join-Path $repo ".env"
              $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText($envPath, "", $utf8NoBom)
              """,
              "init env file",
          )

          # Write .env line-by-line to avoid WinRM command length limits.
          for i, line in enumerate(env_lines, start=1):
              line_b64 = base64.b64encode((line + "\n").encode("utf-8")).decode("ascii")
              run_ps(
                  f"""
                  $ErrorActionPreference = "Stop"
                  $repo = "C:\\groww-bot"
                  $envPath = Join-Path $repo ".env"
                  $line = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("{line_b64}"))
                  $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
                  [System.IO.File]::AppendAllText($envPath, $line, $utf8NoBom)
                  """,
                  f"write env line {i}",
              )

          run_ps(
              f"""
              $ErrorActionPreference = "Stop"
              $repo = "C:\\groww-bot"
              $launcher = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("{launcher_b64}"))
              Set-Content -Path (Join-Path $repo "start-bot.ps1") -Value $launcher -Encoding utf8
              """,
              "write launcher",
          )

          service_script = """
              $ErrorActionPreference = "Stop"
              function Invoke-Native([scriptblock]$Command, [string]$Name) {
                & $Command
                if ($LASTEXITCODE -ne 0) {
                  throw "$Name failed with exit code $LASTEXITCODE"
                }
              }
              $repo = "C:\\groww-bot"
              $logsDir = Join-Path $repo "logs"
              $serviceName = "GrowwBot"
              if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
                Invoke-Native { nssm stop $serviceName confirm } "nssm stop" | Out-Null
                Start-Sleep -Seconds 2
                Invoke-Native { nssm remove $serviceName confirm } "nssm remove" | Out-Null
              }
              $launcherPath = Join-Path $repo "start-bot.ps1"
              Invoke-Native { nssm install $serviceName "powershell.exe" } "nssm install" | Out-Null
              Invoke-Native { nssm set $serviceName AppParameters "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$launcherPath`"" } "nssm set AppParameters" | Out-Null
              Invoke-Native { nssm set $serviceName AppDirectory $repo } "nssm set AppDirectory" | Out-Null
              Invoke-Native { nssm set $serviceName AppStdout (Join-Path $logsDir "bot.log") } "nssm set AppStdout" | Out-Null
              Invoke-Native { nssm set $serviceName AppStderr (Join-Path $logsDir "bot-error.log") } "nssm set AppStderr" | Out-Null
              Invoke-Native { nssm set $serviceName AppRotateFiles 1 } "nssm set AppRotateFiles" | Out-Null
              Invoke-Native { nssm set $serviceName AppRotateOnline 1 } "nssm set AppRotateOnline" | Out-Null
              Invoke-Native { nssm set $serviceName Start SERVICE_AUTO_START } "nssm set Start" | Out-Null
              Invoke-Native { nssm set $serviceName AppExit Default Restart } "nssm set AppExit" | Out-Null
              Invoke-Native { nssm set $serviceName AppThrottle 15000 } "nssm set AppThrottle" | Out-Null
              Invoke-Native { nssm start $serviceName } "nssm start" | Out-Null
              Start-Sleep -Seconds 3
              $status = (nssm status $serviceName).Trim()
              if ($status -ne "SERVICE_RUNNING") { throw "Service failed to start: $status" }
              Write-Host "$serviceName is running."
              """
          run_ps(service_script, "configure/start service")
          PY
